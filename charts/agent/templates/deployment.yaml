apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "agent.fullname" . }}
  labels:
    {{- include "agent.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "agent.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      {{- with .Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      labels:
        {{- include "agent.selectorLabels" . | nindent 8 }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "agent.serviceAccountName" . }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - args:
          - --health-probe-bind-address=:8081
          - --metrics-bind-address=127.0.0.1:8080
          - --leader-elect=false
          - --zap-log-level={{ .Values.logLevel | default 3 }}
          - --zap-encoder={{ .Values.logEncoder | default "console" }}
          - --cluster-name={{ .Values.clustername }}
          {{- if .Values.manager.master }}
          - --hub-url={{ .Values.manager.master }}
          {{- end }}
          - --heartbeat-interval={{ .Values.heartbeatInterval }}
          - --enable-addons={{ .Values.addons.enabled }}
          {{- if .Values.manager.tunnel }}
          - --tunnel-url={{ .Values.manager.tunnel }}
          {{- end }}
          {{- with .Values.manager.region }}
          - --region={{ . }}
          {{- end }}
          {{- with .Values.manager.area }}
          - --area={{ . }}
          {{- end }}
          {{- if .Values.tracing.enabled }}
          - --otlp-endpoint={{ .Values.tracing.otlpEndpoint }}
          - --otlp-insecure={{ .Values.tracing.otlpInsecure }}
          - --trace-sample-rate={{ .Values.tracing.sampleRate }}
          {{- end }}
          command:
          - /agent
          name: {{ .Chart.Name }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          env:
            - name: NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            {{- if .Values.manager.existingSecret }}
            - name: KUMQUAT_AGENT_BOOTSTRAP_TOKEN_FILE
              value: /var/run/secrets/kumquat-remote/token
            - name: KUMQUAT_AGENT_HUB_CA_FILE
              value: /var/run/secrets/kumquat-remote/hub-ca.crt
            - name: KUMQUAT_AGENT_TUNNEL_CA_FILE
              value: /var/run/secrets/kumquat-remote/tunnel-ca.crt
            {{- end }}
            {{- if .Values.tracing.enabled }}
            - name: OTEL_SERVICE_NAME
              value: "engine-agent"
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: {{ .Values.tracing.otlpEndpoint | quote }}
            - name: OTEL_EXPORTER_OTLP_INSECURE
              value: {{ .Values.tracing.otlpInsecure | quote }}
            - name: OTEL_TRACES_SAMPLER
              value: "traceidratio"
            - name: OTEL_TRACES_SAMPLER_ARG
              value: {{ .Values.tracing.sampleRate | quote }}
            {{- end }}
          livenessProbe:
            failureThreshold: 3
            httpGet:
              path: /healthz
              port: 8081
              scheme: HTTP
            initialDelaySeconds: 15
            periodSeconds: 20
            successThreshold: 1
            timeoutSeconds: 1
          readinessProbe:
            failureThreshold: 3
            httpGet:
              path: /readyz
              port: 8081
              scheme: HTTP
            initialDelaySeconds: 5
            periodSeconds: 10
            successThreshold: 1
            timeoutSeconds: 1
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            - name: helm-cache
              mountPath: /home/nonroot/.cache
            {{- if .Values.manager.existingSecret }}
            - name: remote-credentials
              mountPath: /var/run/secrets/kumquat-remote
              readOnly: true
            {{- end }}
      volumes:
        - name: helm-cache
          emptyDir: {}
      {{- if .Values.manager.existingSecret }}
        - name: remote-credentials
          secret:
            secretName: {{ .Values.manager.existingSecret | quote }}
            items:
              - key: {{ .Values.manager.tokenKey | quote }}
                path: token
              - key: {{ .Values.manager.hubCAKey | quote }}
                path: hub-ca.crt
              - key: {{ .Values.manager.tunnelCAKey | quote }}
                path: tunnel-ca.crt
      {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
