# Default values for agent.
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.

replicaCount: 1

image:
  repository: kumquat/engine
  pullPolicy: IfNotPresent
  # Overrides the image tag whose default is the chart appVersion.
  tag: "latest"

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

clustername: "agent"
heartbeatInterval: 1m

enableSchemes: cluster,deployment,cronjob

logLevel: 5
logEncoder: json

manager:
  # Leave these empty for an agent running in the Hub cluster. Remote agents
  # must reference a separately managed Secret instead of putting credentials
  # in Helm values or Pod arguments.
  master: ""
  tunnel: ""
  existingSecret: ""
  tokenKey: token
  hubCAKey: hub-ca.crt
  tunnelCAKey: tunnel-ca.crt
  region: ""
  area: ""

addons:
  enabled: false

serviceAccount:
  # Specifies whether a service account should be created
  create: true
  # Annotations to add to the service account
  annotations: {}
  # The name of the service account to use.
  # If not set and create is true, a name is generated using the fullname template
  name: ""

podAnnotations: {}

podSecurityContext:
  fsGroup: 65532

securityContext:
  capabilities:
    drop:
    - ALL
  readOnlyRootFilesystem: true
  runAsNonRoot: true
  runAsUser: 65532

resources:
  # We usually recommend not to specify default resources and to leave this as a conscious
  # choice for the user. This also increases chances charts run on environments with little
  # resources, such as Minikube. If you do want to specify resources, uncomment the following
  # lines, adjust them as necessary, and remove the curly braces after 'resources:'.
  limits:
    cpu: 500m
    memory: 512Mi
  requests:
    cpu: 100m
    memory: 128Mi

nodeSelector: {}

tolerations: []

affinity: {}

# OpenTelemetry Tracing configuration
tracing:
  enabled: false
  otlpEndpoint: ""
  otlpInsecure: true
  sampleRate: 1.0
