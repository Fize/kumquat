apiVersion: v1
kind: Secret
metadata:
  name: kumquat-api
  namespace: kumquat-system
type: Opaque
stringData:
  # Replace before applying. The API refuses to start with an empty JWT secret.
  jwt-secret: ""
  # Reference an externally managed MySQL service. Do not commit real values.
  mysql-host: ""
  mysql-user: ""
  mysql-password: ""
  mysql-database: ""
