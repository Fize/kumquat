apiVersion: v1
kind: Service
metadata:
  name: api
  namespace: kumquat-system
  labels:
    app.kubernetes.io/name: api
    app.kubernetes.io/part-of: kumquat
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: api
  ports:
    - name: http
      port: 8080
      targetPort: 8080
      protocol: TCP
    - name: metrics
      port: 9090
      targetPort: 9090
      protocol: TCP
