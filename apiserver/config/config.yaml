server:
  bindAddr: ":8080"
  metrics:
    enabled: true
    serviceName: api
    path: /metrics
    port: 9090
  trace:
    enabled: true
    serviceName: api
    stdout: true

sql:
  type: sqlite3
  host: ""
  user: ""
  password: ""
  db: "./api.db"
  maxIdleConns: 1
  maxOpenConns: 1
  debug: false

log:
  level: info
  format: json

custom:
  jwt:
    secret: ""
    expire_duration: 24h
    reset_expire_duration: 10m
  security:
    allowed_email_domains: []
  kubernetes:
    kubeconfig_path: ""
    master_url: ""
